<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selamat Datang di EternalSMP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --gold: #ffd700;
      --dark: #000;
      --text: #fff;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background bintang animasi */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://i.ibb.co/vV3zFZ4/stars.png') repeat;
      animation: starsMove 60s linear infinite;
      opacity: 0.3;
      z-index: -1;
    }

    @keyframes starsMove {
      0% { background-position: 0 0; }
      100% { background-position: 1000px 1000px; }
    }

    .hero {
      padding: 80px 20px;
      text-align: center;
      color: var(--gold);
      animation: fadeSlide 1.2s ease-out;
    }

    .hero h1 {
      font-family: 'Cinzel', serif;
      font-size: 42px;
      margin-bottom: 16px;
      animation: glowText 2s infinite alternate;
    }

    .hero p {
      font-size: 18px;
      max-width: 700px;
      margin: 0 auto;
      color: #ccc;
      opacity: 0.85;
    }

    .cta-button {
      margin-top: 32px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid var(--gold);
      color: var(--gold);
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      animation: pulseGlow 2.5s infinite;
    }
    .cta-button:hover {
      background: var(--gold);
      color: #000;
      transform: scale(1.05);
    }

    footer {
      background: #000;
      color: #999;
      text-align: center;
      padding: 20px;
      margin-top: auto;
      border-top: 1px solid var(--gold);
    }
    footer .social {
      margin-top: 8px;
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    footer .social li a {
      color: var(--gold);
      font-size: 18px;
    }

    @keyframes glowText {
      0% { text-shadow: 0 0 5px #fff, 0 0 10px var(--gold); }
      100% { text-shadow: 0 0 10px #fff, 0 0 20px var(--gold); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px var(--gold); }
      50% { box-shadow: 0 0 20px var(--gold), 0 0 30px #fff; }
      100% { box-shadow: 0 0 10px var(--gold); }
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1>🌙 Selamat Datang di Dunia EternalSMP</h1>
    <p>
      Siapkan karaktermu dan masuki dunia yang dipenuhi sihir, konflik, serta legenda!
      Pendaftaran karakter OC kini dibuka untuk Season terbaru Eternal SMP.  
    </p>
    <a href="https://eternalsmpoc.vercel.app/page2.html">
      <button class="cta-button">📝 Daftar Karakter OC Sekarang</button>
    </a>
  </section>

  <footer>
    <p>&copy; 2025 Eternal SMP. All rights reserved.</p>
    <ul class="social">
      <li><a href="https://instagram.com/eternalsmp" target="_blank"><i class="fab fa-instagram"></i></a></li>
      <li><a href="https://youtube.com/@eternalsmpserver" target="_blank"><i class="fab fa-youtube"></i></a></li>
      <li><a href="https://www.tiktok.com/@eternalsmpserver" target="_blank"><i class="fab fa-tiktok"></i></a></li>
    </ul>
  </footer>

</body>
</html>
